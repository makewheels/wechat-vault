[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wechat-vault"
version = "0.1.0"
description = "WeChat chat archive: WeFlow -> Tablestore + OSS"
requires-python = ">=3.11"
dependencies = [
  "tablestore>=6.4.0",
  "oss2>=2.18.0",
  "cryptography>=50.0.2",
  "zstandard>=0.25.0",
  "av>=18.1.1",
  "pillow>=13.0.0",
]

[project.scripts]
wechat-vault = "wechat_vault.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wechat_vault"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
link-mode = "hardlink"
